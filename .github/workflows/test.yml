name: Soroban Contract Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install stellar-cli --version 21.7.2 --locked

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/payroll_registry/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM with stellar contract build
        working-directory: contracts/payroll_registry
        run: stellar contract build

      - name: Run unit tests
        working-directory: contracts/payroll_registry
        run: cargo test --verbose
        continue-on-error: true

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: payroll_registry_wasm
          path: contracts/payroll_registry/target/wasm32v1-none/release/payroll_registry.wasm
